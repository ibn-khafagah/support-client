name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
        laravel: ['11.*', '12.*', '13.*']
        include:
          - laravel: '11.*'
            testbench: '9.*'
            pest: '3.*'
          - laravel: '12.*'
            testbench: '10.*'
            pest: '3.*'
          - laravel: '13.*'
            testbench: '11.*'
            pest: '4.*'
        exclude:
          - laravel: '13.*'
            php: '8.2'
    name: PHP ${{ matrix.php }} – Laravel ${{ matrix.laravel }}
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, json, mbstring, sqlite, pdo_sqlite
          coverage: none
      - name: Install dependencies
        run: |
          composer require "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" "pestphp/pest:${{ matrix.pest }}" "pestphp/pest-plugin-laravel:${{ matrix.pest }}" --no-interaction --no-update --dev
          composer update --prefer-dist --no-interaction --no-progress
      - name: Run tests
        run: vendor/bin/pest
